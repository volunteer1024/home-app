<!DOCTYPE html>

<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecc8",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221f",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .active-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
    <div class="max-w-md mx-auto bg-white dark:bg-slate-900 min-h-screen flex flex-col shadow-xl">
        <header class="sticky top-0 z-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 pt-6 pb-4">

                    <span class="material-symbols-outlined text-3xl">more_horiz</span>
                </button>
            </div>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-slate-400 text-2xl">search</span>
                </div>
                <input
                    class="block w-full pl-12 pr-4 py-4 bg-slate-100 dark:bg-slate-800 border-none rounded-xl text-lg focus:ring-2 focus:ring-primary placeholder:text-slate-400"

                    </div>
                </div>
                <div class="flex-1 min-w-0">

                    <span class="material-symbols-outlined text-4xl">play_circle</span>

            <div
                class="flex items-center gap-5 p-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 rounded-xl transition-colors cursor-pointer border border-transparent">

                    <p class="text-slate-500 dark:text-slate-400 text-lg">白噪音 · 08:20</p>

                    <span class="material-symbols-outlined text-4xl">play_circle</span>

            </div>

            </div>
            <div

                <div class="size-20 shrink-0 rounded-lg bg-cover bg-center bg-slate-200"

                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xl font-bold text-slate-800 dark:text-slate-200 truncate">窗外小雨</p>
                    <p class="text-slate-500 dark:text-slate-400 text-lg">自然音 · 10:30</p>
                </div>
                <button class="size-12 flex items-center justify-center text-slate-400 hover:text-primary">
                    <span class="material-symbols-outlined text-4xl">play_circle</span>
                </button>
            </div>
            <div class="h-24"></div>
        </main>
        <nav
            class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 flex items-center justify-around py-3 px-6 pb-8">
            <a class="flex flex-col items-center gap-1 text-slate-400" href="#">
                <span class="material-symbols-outlined text-3xl">home</span>
                <span class="text-sm font-medium">首页</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-primary" href="#">
                <span class="material-symbols-outlined text-3xl active-icon">music_note</span>
                <span class="text-sm font-medium">音乐</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-slate-400" href="#">
                <span class="material-symbols-outlined text-3xl">favorite</span>

            </a>
            <a class="flex flex-col items-center gap-1 text-slate-400" href="#">

                <span class="text-sm font-medium">我的</span>
